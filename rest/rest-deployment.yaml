apiVersion: apps/v1
kind: Deployment
metadata:
  name: demucs-rest
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demucs-rest
  template:
    metadata:
      labels:
        app: demucs-rest
    spec:
      containers:
        - name: rest
          image: us-central1-docker.pkg.dev/arka-lab5-2026/demucs-images/rest:v1
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: S3_ENDPOINT
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: INPUT_BUCKET
              value: "queue"
            - name: OUTPUT_BUCKET
              value: "output"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: worker-rustfs-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: worker-rustfs-credentials
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
