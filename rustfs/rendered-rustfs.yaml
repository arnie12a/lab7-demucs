---
# Source: rustfs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    helm.sh/chart: rustfs-1.0.4
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/version: "1.0.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/instance: rustfs
    spec:
      serviceAccountName: rustfs
      imagePullSecrets:
        []
      affinity:
      priorityClassName: 
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
      initContainers:
        - name: init-step
          image: "busybox:stable"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              mkdir -p /data
              mkdir -p /mnt/rustfs/logs
              chmod 755 /mnt/rustfs/logs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /mnt/rustfs
      containers:
        - name: rustfs
          image: "rustfs/rustfs:1.0.4"
          command: ["/usr/bin/rustfs"]
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: endpoint
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: rustfs-config
            - secretRef:
                name: rustfs-secret
          resources:
            {}
          
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /logs
              subPath: logs
            - name: data
              mountPath: /data
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: rustfs-logs
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data

---
# Source: rustfs/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    helm.sh/chart: rustfs-1.0.4
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/version: "1.0.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-name: rustfs
spec:
  ingressClassName: nginx
  rules:
    - host: "console.rustfs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  name: console
    - host: "endpoint.rustfs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  name: endpoint
