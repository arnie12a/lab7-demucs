apiVersion: v1
kind: Pod
metadata:
  name: "rustfs-test-connection"
  namespace: rustfs
  labels:
    helm.sh/chart: rustfs-1.0.4
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/version: "1.0.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
